version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gotalk-postgres
    environment:
      POSTGRES_USER: gotalk
      POSTGRES_PASSWORD: gotalk
      POSTGRES_DB: gotalk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotalk"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gotalk-server
    environment:
      DATABASE_URL: postgres://gotalk:gotalk@postgres:5432/gotalk?sslmode=disable
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dist:/app/dist

volumes:
  postgres_data:
